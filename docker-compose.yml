services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zeropalabre
      POSTGRES_PASSWORD: zeropalabre
      POSTGRES_DB: zeropalabre
    ports:
      - "5432:5432"
    volumes:
      - zeropalabre_pg:/var/lib/postgresql/data

volumes:
  zeropalabre_pg:
